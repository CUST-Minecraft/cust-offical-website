schema: spec-driven

context: |
  # 项目身份
  本项目是长春理工大学 Minecraft 社团官网，面向游客、校内学生、潜在新成员和社员。
  网站目标是提供统一的社团展示入口、内容发布入口和外部服务引导入口。
  视觉方向应体现 Minecraft / 方块 / 像素风，但整体体验需要清晰、克制、可维护，避免过度游戏化影响信息阅读。

  # 当前阶段边界
  第一阶段范围包括官网前台、Header 皮肤站公开外链入口和 Strapi Admin 内容管理。
  皮肤站是独立系统，官网只提供公开外链入口，不嵌入、不代理、不管理皮肤站业务数据。
  资源包、整合包、地图和文件下载通过 QQ 群等社群渠道分发，不在官网建设下载服务。
  自研后台不是第一阶段必做内容，只有在活动报名、白名单审核、复杂成员系统或精细权限需求明确后再单独规划。

  # 技术栈
  前端使用 Nuxt 3、Vue 3、TypeScript、Tailwind CSS 和自定义像素风 CSS。
  内容管理使用 Strapi 5，数据库优先按设计文档使用 PostgreSQL。
  媒体资源按设计文档规划使用对象存储和 CDN。

  # 架构约束
  前端通过 Nuxt Server Routes / Nitro 的 /api/public/* 访问公开数据，不直接调用 Strapi 原始 API。
  公开详情页使用 slug，不在公开 URL 中暴露数据库 ID。
  CMS 内容模型位于 strapi-models/，前端适配逻辑位于 frontend/server/utils/strapi.ts 及相关 server routes。
  页面、接口、数据模型、缓存、SEO 和媒体规则以 docs/详细设计文档.md 为准。

  # 内容与隐私
  不在公开页面展示真实姓名、学号、手机号等敏感信息。
  成员资料、作品、活动、公告等公开内容应优先通过 Strapi 内容模型管理。
  媒体字段需要规范化为 { src, alt }，alt 优先使用 Strapi 媒体字段的 alternativeText 或 caption。

  # 中文化约定
  OpenSpec 产物默认使用简体中文，包括 proposal、design、tasks 和 specs。
  技术名词、框架名、API 路径、代码标识符、文件路径和命令保留英文原文。
  中文表达应自然、明确，避免直译腔；需求、验收场景和任务描述应优先使用短句。
  面向用户的页面文案应符合中文语境，并与长春理工大学 Minecraft 社团的校园社团身份一致。

  # 文档协作
  docs/ 下已经书写完成的项目文档是需求、设计、架构、接口、数据模型、权限和开发规范的权威参考来源。
  创建或修改 OpenSpec 产物前，应先参考 docs/ 下相关文档，不能只依据临时对话或局部代码推断项目规则。
  进行新的改动前，应先检查项目中是否已经存在相同或相近功能；如果已存在，必须额外参考该功能的当前代码实现和 docs/ 中对此功能的描述，再决定复用、修改或扩展。
  修改页面范围、接口、数据模型、权限、技术栈、部署方式、非功能需求或用户可见行为时，必须同步考虑并更新 docs/ 下对应文档。
  产品需求文档描述“要做什么”，总体设计文档描述“系统怎么搭”，详细设计文档描述“页面、接口、模型、权限和规则如何落地”，开发规范文档描述“代码怎么写”。
  不要把详细设计内容写进产品需求文档，不要把代码风格规范写进详细设计文档，不要把后续自研后台内容混入第一阶段 Strapi 实施方案。

rules:
  proposal:
    - 生成或更新 proposal 前，先参考 docs/ 下与该变更相关的已完成文档。
    - proposal 应说明该变更涉及哪些既有文档，以及是否需要同步更新 docs/。
    - 如果 proposal 与 docs/ 现有内容冲突，应明确指出冲突点，不要静默覆盖。
  design:
    - design 必须与 docs/总体设计文档.md、docs/详细设计文档.md 和相关专题文档保持一致。
    - 涉及架构、接口、数据模型、权限、缓存、SEO、媒体或部署的设计变更，必须标记需要同步更新 docs/。
    - 不要在 design 中引入超出当前阶段边界的自研后台或皮肤站业务逻辑，除非对应 docs 已先明确调整。
  specs:
    - specs 中的需求和验收场景必须参考 docs/ 中已有需求、页面范围、接口规则和权限规则。
    - 当 spec 新增、修改或移除用户可见行为时，必须同步检查 docs/产品需求文档.md 和 docs/详细设计文档.md。
    - 如果 spec 改变技术约束或实现规范，必须同步检查 docs/总体设计文档.md 和 docs/开发规范文档.md。
  tasks:
    - tasks 必须包含“阅读相关 docs”和“同步更新相关 docs”的检查项，除非该变更明确不影响需求、设计、接口、数据模型、权限或用户可见行为。
    - 实现任务应排在文档确认或文档更新之后，避免代码与已完成 docs 脱节。
